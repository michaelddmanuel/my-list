<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartFitter ActionSheet</title>
<meta name="theme-color" content="#3B322C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script>
/* apply saved appearance before first paint (no flash) */
(function(){
  try{
    var c=JSON.parse(localStorage.getItem("list_theme")||"null")||{hdBg:"#3B322C",hdText:"#EFE7DC",bdBg:"#FAF6F2",bdText:"#2A2420"};
    var s=document.documentElement.style;
    s.setProperty("--hd-bg",c.hdBg); s.setProperty("--hd-text",c.hdText); s.setProperty("--bd-bg",c.bdBg); s.setProperty("--bd-text",c.bdText);
    var m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute("content",c.hdBg);
    document.documentElement.setAttribute("data-font", localStorage.getItem("list_font")||"system");
    document.documentElement.setAttribute("data-size", localStorage.getItem("list_size")||"m");
    if(localStorage.getItem("list_bold")==="1") document.documentElement.setAttribute("data-bold","1");
  }catch(e){}
})();
</script>
<style>
  :root{
    --hd-bg:#3B322C; --hd-text:#EFE7DC; --bd-bg:#FAF6F2; --bd-text:#2A2420;
    --row-alt:color-mix(in srgb, var(--bd-bg) 94%, var(--bd-text));
    --line:color-mix(in srgb, var(--bd-bg) 82%, var(--bd-text));
    --accent:var(--hd-bg); --muted:color-mix(in srgb, var(--bd-text) 55%, var(--bd-bg));
    --fs:15px; --tap:38px; --pad:6px; --fw:400;
  }
  html[data-size="s"]{--fs:14px; --tap:38px; --pad:6px;}
  html[data-size="l"]{--fs:19px; --tap:54px; --pad:12px;}
  html[data-size="xl"]{--fs:24px; --tap:66px; --pad:16px;}
  html[data-bold="1"]{--fw:650;}
  html[data-font="system"]{--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  html[data-font="serif"]{--font:Georgia,Cambria,"Times New Roman",serif;}
  html[data-font="rounded"]{--font:"Segoe UI Rounded","SF Pro Rounded",ui-rounded,"Segoe UI",Roboto,sans-serif;}
  html[data-font="mono"]{--font:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;}
  html[data-font="elegant"]{--font:Constantia,"Palatino Linotype",Palatino,Georgia,serif;}
  html{--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bd-bg); color:var(--bd-text); font-family:var(--font); font-size:var(--fs); font-weight:var(--fw);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust:100%; touch-action:manipulation;}
  .wrap{width:100%; margin:0; padding:3px 6px 12px;}
  header{display:flex; align-items:center; gap:9px; margin:2px 0 8px; background:var(--hd-bg); color:var(--hd-text); padding:6px 10px; border-radius:10px;}
  header .logo{height:26px; width:auto; display:block; flex:0 0 auto;}
  header .brand{flex:1; min-width:0; margin:0; font-size:calc(var(--fs) + 5px); font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.3px; color:var(--hd-text);}
  header .iconbtn{background:transparent; color:var(--hd-text); border-color:color-mix(in srgb, var(--hd-text) 42%, transparent);}
  .iconbtn{width:var(--tap); height:var(--tap); min-width:var(--tap); border:1px solid var(--line); background:var(--bd-bg);
    color:var(--bd-text); border-radius:11px; font-size:calc(var(--fs) + 3px); cursor:pointer; display:grid; place-items:center;}
  .iconbtn:active{transform:scale(.96);}
  .bar{display:flex; gap:8px; align-items:center; margin:0 4px 10px; flex-wrap:wrap;}
  .bar input.q{flex:1 1 180px; width:0; min-width:0; height:var(--tap); border:1px solid var(--line); background:var(--bd-bg);
    color:var(--bd-text); border-radius:11px; padding:0 12px; font-size:var(--fs); font-family:var(--font); outline:none;}
  .bar input.q:focus{border-color:var(--accent);}
  .btn{height:var(--tap); border:none; border-radius:11px; padding:0 16px; font-size:var(--fs); font-weight:600; font-family:var(--font);
    background:var(--hd-bg); color:var(--hd-text); cursor:pointer;}
  .btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--line);}
  .btn:active{filter:brightness(1.08);}
  .mic.rec{background:#dc2626; color:#fff; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5);}50%{box-shadow:0 0 0 9px rgba(220,38,38,0);}}
  details.quick{margin:0 4px 10px;}
  details.quick summary{cursor:pointer; color:var(--muted); font-size:calc(var(--fs) - 2px); list-style:none; padding:4px 2px;}
  details.quick summary::-webkit-details-marker{display:none;}
  .chips{display:flex; flex-wrap:wrap; gap:7px; padding:8px 2px;}
  .chip{border:1px solid var(--line); background:var(--bd-bg); color:var(--bd-text); border-radius:999px; padding:7px 13px; font-size:calc(var(--fs) - 2px); cursor:pointer;}
  .chip:active{background:var(--accent); color:var(--hd-text);}
  .bar .fsel{height:var(--tap); border:1px solid var(--line); background:var(--bd-bg); color:var(--bd-text); border-radius:11px; padding:0 10px; font-size:calc(var(--fs) - 1px); font-family:var(--font); outline:none; cursor:pointer; max-width:170px;}
  .bar .fsel:focus{border-color:var(--accent);}
  .bar .hd{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:calc(var(--fs) - 2px); white-space:nowrap; cursor:pointer;}
  .bar .hd input{width:18px; height:18px; accent-color:var(--accent); cursor:pointer;}
  .bar .seg button{padding:9px 13px;}

  .twrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; -webkit-overflow-scrolling:touch;}
  table{border-collapse:collapse; table-layout:fixed; width:max-content; min-width:100%;}
  th,td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:0; vertical-align:middle; overflow:hidden;}
  th:last-child,td:last-child{border-right:none;}
  thead th{position:sticky; top:0; z-index:3; background:var(--hd-bg); color:var(--hd-text); user-select:none;}
  .th-in{display:flex; align-items:center; gap:4px; padding:0 6px 0 10px; height:var(--tap); font-weight:650; cursor:pointer; position:relative;}
  .th-lbl{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:calc(var(--fs) - 1px);}
  .th-sort{font-size:calc(var(--fs) - 4px); opacity:.85; width:12px;}
  .th-grip{position:absolute; right:0; top:0; width:14px; height:100%; cursor:col-resize; touch-action:none;}
  .th-grip::after{content:""; position:absolute; right:6px; top:22%; height:56%; width:2px; background:var(--hd-text); opacity:.35; border-radius:2px;}
  th.dragging{opacity:.55;}
  th.droppast .th-in::before{content:""; position:absolute; left:-1px; top:0; bottom:0; width:3px; background:var(--hd-text);}
  th.mini,td.mini{width:var(--tap); text-align:center;}
  tbody tr:nth-child(even) td{background:var(--row-alt);}
  tbody tr.done td{opacity:.6;}
  tbody tr.done .cell{ text-decoration:line-through; }
  .cell{width:100%; height:var(--tap); border:none; background:transparent; color:var(--bd-text); font:inherit; font-weight:var(--fw);
    padding:0 10px; outline:none; font-family:var(--font);}
  .cell:focus{background:color-mix(in srgb, var(--accent) 12%, var(--bd-bg)); box-shadow:inset 0 0 0 2px var(--accent);}
  td.pri .cell{text-align:center; font-variant-numeric:tabular-nums; letter-spacing:.04em;}
  .rowbtn{width:var(--tap); height:var(--tap); border:none; background:transparent; color:var(--muted); font-size:calc(var(--fs) + 4px); cursor:pointer; display:grid; place-items:center;}
  .chk{width:calc(var(--tap) - 14px); height:calc(var(--tap) - 14px); border:2px solid var(--accent); border-radius:7px; background:transparent; color:var(--hd-text); cursor:pointer; display:grid; place-items:center; margin:0 auto; font-size:var(--fs);}
  tr.done .chk{background:var(--accent);}
  tr.addrow td{background:transparent !important;}
  tr.addrow .cell::placeholder{color:var(--muted);}
  .foot{display:flex; align-items:center; gap:10px; margin:12px 4px 0; color:var(--muted); font-size:calc(var(--fs) - 3px); flex-wrap:wrap;}
  .foot .grow{flex:1; min-width:70px;}
  .syncdot.on{color:#16a34a;} .syncdot.off{color:var(--muted);}

  .toast{position:fixed; left:50%; top:14px; transform:translate(-50%,-160%); background:#16a34a; color:#fff; padding:12px 18px;
    border-radius:12px; font-weight:600; z-index:60; box-shadow:0 10px 30px rgba(0,0,0,.35); transition:transform .35s; max-width:92vw; text-align:center;}
  .toast.show{transform:translate(-50%,0);}

  .settings{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; z-index:40;}
  .settings.open{display:flex;}
  .sheet{background:var(--bd-bg); color:var(--bd-text); width:100%; max-width:720px; margin:0 auto; border-radius:20px 20px 0 0;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom)); border:1px solid var(--line); max-height:calc(100vh - 20px); overflow-y:auto;}
  .sheet h2{margin:2px 2px 6px; font-size:calc(var(--fs)+3px);} .sheet h3{margin:20px 2px 8px; font-size:calc(var(--fs)+0px); color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-size:calc(var(--fs) - 3px);}
  .fourc{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .cin{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:9px; padding:7px 9px;}
  .cin input[type=color]{-webkit-appearance:none; appearance:none; width:34px; height:30px; border:none; border-radius:6px; padding:0; background:none; cursor:pointer;}
  .cin input[type=color]::-webkit-color-swatch-wrapper{padding:0;} .cin input[type=color]::-webkit-color-swatch{border:none; border-radius:6px;}
  .cin span{font-size:calc(var(--fs) - 3px); color:var(--muted);}
  .presets{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .preset{cursor:pointer; border:1px solid var(--line); border-radius:9px; overflow:hidden; width:64px; text-align:center; background:none; padding:0;}
  .preset .pv{height:26px;} .preset .pv i{display:block; height:13px;} .preset small{display:block; font-size:8.5px; color:var(--muted); padding:3px 2px; line-height:1.15;}
  .saved{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .saved .preset{position:relative;}
  .saved .del{position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; border:1px solid var(--line); background:var(--bd-bg); color:var(--bd-text); font-size:12px; line-height:1; cursor:pointer;}
  .row-inline{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap;}
  .row-inline input.t{flex:1; min-width:0; height:var(--tap); border:1px solid var(--line); background:var(--bd-bg); color:var(--bd-text); border-radius:9px; padding:0 10px; font-size:var(--fs); font-family:var(--font); outline:none;}
  .seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex-wrap:wrap;}
  .seg button{border:none; background:transparent; color:var(--bd-text); padding:9px 13px; cursor:pointer; font-size:calc(var(--fs) - 2px); font-family:var(--font);}
  .seg button.on{background:var(--accent); color:var(--hd-text);}
  .colmgr{margin-top:6px;}
  .colrow{display:flex; align-items:center; gap:6px; padding:7px 0; border-bottom:1px solid var(--line);}
  .colrow input.t{flex:1; min-width:0; height:38px; border:1px solid var(--line); background:var(--bd-bg); color:var(--bd-text); border-radius:8px; padding:0 9px; font-size:calc(var(--fs) - 1px); font-family:var(--font); outline:none;}
  .colrow .mv{width:34px; height:34px; border:1px solid var(--line); background:var(--bd-bg); color:var(--bd-text); border-radius:8px; cursor:pointer; font-size:15px;}
  .colrow .tag{font-size:calc(var(--fs) - 5px); color:var(--muted); width:52px; text-align:center;}
  .cell-status{-webkit-appearance:none; appearance:none; cursor:pointer; font-weight:600;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 14px) calc(50% - 1px),calc(100% - 9px) calc(50% - 1px); background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:24px;}
  .cell-status[data-v=""]{color:var(--muted); font-weight:400;}
  .cell-status[data-v="Open"]{color:#b45309; background-color:color-mix(in srgb,#b45309 12%,var(--bd-bg));}
  .cell-status[data-v="In progress"]{color:#2563eb; background-color:color-mix(in srgb,#2563eb 12%,var(--bd-bg));}
  .cell-status[data-v="Blocked"]{color:#dc2626; background-color:color-mix(in srgb,#dc2626 13%,var(--bd-bg));}
  .cell-status[data-v="Done"]{color:#16a34a; background-color:color-mix(in srgb,#16a34a 13%,var(--bd-bg));}
  .rosterlist{margin-top:10px; display:flex; flex-wrap:wrap;}
  .rchip{display:inline-flex; align-items:center; gap:4px; background:color-mix(in srgb,var(--bd-bg) 84%,var(--bd-text)); border:1px solid var(--line); border-radius:999px; padding:5px 4px 5px 12px; font-size:calc(var(--fs) - 2px); margin:0 6px 6px 0;}
  .rchip button{border:none; background:transparent; color:var(--muted); font-size:16px; line-height:1; cursor:pointer; width:22px; height:22px; border-radius:50%;}
  .rchip button:active{transform:scale(.88);}
  .installhint{margin-top:14px; color:var(--muted); font-size:calc(var(--fs) - 3px); line-height:1.5;}
</style>
</head>
<body>
<div id="toast" class="toast" role="status"></div>
<div class="wrap">
  <header>
    <img class="logo" src="sf-logo.png" alt="SmartFitter">
    <span class="brand" id="title">ActionSheet</span>
    <button class="iconbtn mic" id="micBtn" title="Add by voice" aria-label="Add by voice">&#127908;</button>
    <button class="iconbtn" id="setBtn" title="Settings" aria-label="Settings">&#9881;</button>
  </header>
  <datalist id="common"></datalist>
  <datalist id="roster"></datalist>

  <div class="bar">
    <input class="q" id="q" type="search" placeholder="Search all items…" autocomplete="off">
    <div class="seg" id="viewSeg">
      <button data-view="all" class="on">All</button>
      <button data-view="open">Open</button>
      <button data-view="overdue">Overdue</button>
      <button data-view="done">Done</button>
    </div>
    <select class="fsel" id="fAssignee"><option value="">Everyone</option></select>
    <label class="hd"><input type="checkbox" id="hideDone"> Hide ticked</label>
  </div>

  <div class="twrap"><table id="tbl"><colgroup id="cg"></colgroup><thead id="thd"></thead><tbody id="tb"></tbody></table></div>

  <div class="foot">
    <span class="grow" id="count"></span>
    <span class="syncdot" id="syncdot"></span>
    <button class="btn ghost" id="clrDone">Clear ticked</button>
    <button class="btn ghost" id="clrAll">Clear all</button>
  </div>
</div>

<div class="settings" id="settings">
  <div class="sheet">
    <h2>Settings</h2>

    <h3>Colour theme</h3>
    <div class="fourc">
      <label class="cin"><input type="color" id="cHdBg"><span>Heading background</span></label>
      <label class="cin"><input type="color" id="cHdText"><span>Heading text</span></label>
      <label class="cin"><input type="color" id="cBdBg"><span>Body background</span></label>
      <label class="cin"><input type="color" id="cBdText"><span>Body text</span></label>
    </div>
    <div class="presets" id="presets"></div>
    <div class="row-inline">
      <input class="t" id="themeName" maxlength="24" placeholder="Name this theme">
      <button class="btn" id="saveTheme">Save</button>
    </div>
    <div class="saved" id="savedThemes"></div>

    <h3>Font</h3>
    <div class="seg" id="fontSeg">
      <button data-font="system">System</button><button data-font="serif">Serif</button>
      <button data-font="rounded">Rounded</button><button data-font="elegant">Elegant</button><button data-font="mono">Mono</button>
    </div>
    <div class="row-inline">
      <div class="seg" id="boldSeg"><button data-bold="0">Normal</button><button data-bold="1">Bold</button></div>
      <div class="seg" id="sizeSeg"><button data-size="s">S</button><button data-size="m">M</button><button data-size="l">L</button><button data-size="xl">XL</button></div>
    </div>

    <h3>Columns</h3>
    <div class="colmgr" id="colmgr"></div>
    <button class="btn ghost" id="addColS" style="margin-top:10px; width:100%;">&#43; Add a column</button>

    <h3>Team roster</h3>
    <div class="row-inline">
      <input class="t" id="rosterName" maxlength="40" placeholder="Add a team member's name">
      <button class="btn" id="rosterAdd">Add</button>
    </div>
    <div class="rosterlist" id="rosterList"></div>

    <div class="installhint" id="installHint"></div>
    <div class="row-inline" style="margin-top:16px;">
      <button class="btn" id="installBtn" style="display:none; flex:1;">Install app</button>
      <button class="btn ghost" id="closeSet" style="flex:1;">Done</button>
    </div>
  </div>
</div>

<script src="sync.js"></script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  function load(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
  function saveRaw(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  var DEFAULT_COLS=[
    {key:"desc",label:"Description",type:"text",width:240,hidden:false,builtin:true},
    {key:"actioned",label:"Actioned to",type:"person",width:150,hidden:false,builtin:true},
    {key:"status",label:"Status",type:"status",width:140,hidden:false,builtin:true},
    {key:"due",label:"Due Date",type:"date",width:150,hidden:false,builtin:true},
    {key:"venue",label:"Venue",type:"text",width:160,hidden:false,builtin:true},
    {key:"priority",label:"Priority",type:"priority",width:110,hidden:false,builtin:true}
  ];
  var STATUS_OPTS=["","Open","In progress","Blocked","Done"];
  var COMMON=["Fuel","Bread","Milk","Sugar","Eggs","Butter","Coffee","Tea","Rice","Salt","Cooking oil","Flour","Cheese","Chicken","Onions","Potatoes","Tomatoes","Bananas","Apples","Toilet paper","Soap","Toothpaste","Washing powder","Dish soap"];
  var PRESETS=[
    {name:"Bronze",hdBg:"#4A3B27",hdText:"#F3E9D8",bdBg:"#FBF7F0",bdText:"#2A2419"},
    {name:"Mocha",hdBg:"#3B322C",hdText:"#EFE7DC",bdBg:"#FAF6F2",bdText:"#2A2420"},
    {name:"Mink",hdBg:"#3A3733",hdText:"#ECE7DF",bdBg:"#F7F5F2",bdText:"#29261F"},
    {name:"Charcoal",hdBg:"#22252A",hdText:"#EEF0F2",bdBg:"#FFFFFF",bdText:"#20242A"},
    {name:"Navy",hdBg:"#1F2A44",hdText:"#E7ECF5",bdBg:"#F4F6FB",bdText:"#20263A"},
    {name:"Forest",hdBg:"#22362A",hdText:"#E6EFE7",bdBg:"#F3F7F3",bdText:"#22302A"},
    {name:"Night",hdBg:"#0F1113",hdText:"#EDE6D6",bdBg:"#1A1C1F",bdText:"#E9E6DF"}
  ];

  var board=load("list_board",null);
  if(!board){
    var old=load("list_items_v1",null); var rows=[];
    if(old&&old.length){ old.forEach(function(it){ rows.push({id:uid(),done:!!it.done,vals:{desc:it.text||"",due:"",venue:"",priority:""}}); }); }
    board={columns:DEFAULT_COLS.slice(),rows:rows};
  }
  if(!board.columns||!board.columns.length) board.columns=DEFAULT_COLS.slice();
  (function(){ var have={}; board.columns.forEach(function(c){have[c.key]=1;}); DEFAULT_COLS.forEach(function(dc){ if(!have[dc.key]){ var i=DEFAULT_COLS.indexOf(dc); board.columns.splice(Math.min(i,board.columns.length),0,Object.assign({},dc)); } }); })();
  if(!board.roster) board.roster=[];
  var stamp=load("list_stamp2",0);
  var sort=load("list_sort",{key:null,dir:1});
  var filter=load("list_filter",{q:"",view:"all",assignee:"",hideDone:false});
  var theme=load("list_theme",{hdBg:"#3B322C",hdText:"#EFE7DC",bdBg:"#FAF6F2",bdText:"#2A2420"});
  var savedThemes=load("list_saved_themes",[]);
  var fontPref=localStorage.getItem("list_font")||"system";
  var boldPref=localStorage.getItem("list_bold")==="1";
  var sizePref=localStorage.getItem("list_size")||"m";

  var cg=$("cg"), thd=$("thd"), tb=$("tb"), syncdot=$("syncdot");

  var syncTimer=null, pendingRemote=null;
  function flushSync(){ if(window.ListSync&&ListSync.push){ clearTimeout(syncTimer); syncTimer=null; ListSync.push(board,stamp); } }
  function commit(){ stamp=Date.now(); saveRaw("list_board",board); saveRaw("list_stamp2",stamp); if(window.ListSync&&ListSync.push){ clearTimeout(syncTimer); syncTimer=setTimeout(flushSync,600); } }
  function updateCount(){ var total=board.rows.length, d=board.rows.filter(function(r){return r.done;}).length; var base= total?(total+" item"+(total!==1?"s":"")+" \u00b7 "+d+" ticked"):""; var shown=tb?tb.querySelectorAll("tr:not(.addrow)").length:total; $("count").textContent = (filtering()&&total) ? (shown+" shown \u00b7 "+base) : base; }
  function applyRemote(rem){ board=rem.data; if(!board.columns||!board.columns.length) board.columns=DEFAULT_COLS.slice(); if(!board.roster) board.roster=[]; stamp=rem.stamp; saveRaw("list_board",board); saveRaw("list_stamp2",stamp); render(); buildColMgr(); buildRoster(); buildRosterUI(); buildAssignee(); }
  function cols(){ return board.columns.filter(function(c){return !c.hidden;}); }
  function pad4(v){ if(v===""||v===null||v===undefined) return ""; var n=parseInt(v,10); if(isNaN(n)) return String(v); return (n<0?"-":"")+String(Math.abs(n)).padStart(4,"0"); }

  function sortedRows(){
    var rs=board.rows.slice();
    if(sort.key){
      var col=null,i; for(i=0;i<board.columns.length;i++) if(board.columns[i].key===sort.key) col=board.columns[i];
      rs.sort(function(a,b){
        var x=(a.vals[sort.key]||""), y=(b.vals[sort.key]||"");
        if(col&&col.type==="priority"){ x=parseInt(x,10); y=parseInt(y,10); x=isNaN(x)?Infinity:x; y=isNaN(y)?Infinity:y; return (x-y)*sort.dir; }
        return String(x).localeCompare(String(y),undefined,{numeric:true})*sort.dir;
      });
    }
    return rs;
  }

  function filtering(){ return !!(filter.q||filter.view!=="all"||filter.assignee||filter.hideDone); }
  function saveFilter(){ saveRaw("list_filter",filter); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function matchRow(row){
    if(filter.assignee && (row.vals.actioned||"")!==filter.assignee) return false;
    var st=row.vals.status||"", done=row.done||st==="Done";
    if(filter.view==="open"){ if(done) return false; }
    else if(filter.view==="done"){ if(!done) return false; }
    else if(filter.view==="overdue"){ var due=row.vals.due||""; if(done||!due||due>=todayISO()) return false; }
    if(filter.hideDone && filter.view!=="done" && done) return false;
    if(filter.q){ var q=filter.q.toLowerCase(), hit=false; for(var k in row.vals){ if(String(row.vals[k]||"").toLowerCase().indexOf(q)>=0){ hit=true; break; } } if(!hit) return false; }
    return true;
  }
  function visibleRows(){ return sortedRows().filter(matchRow); }
  function buildAssignee(){
    var sel=$("fAssignee"); if(!sel) return; var cur=filter.assignee;
    sel.innerHTML=""; var o0=document.createElement("option"); o0.value=""; o0.textContent="Everyone"; sel.appendChild(o0);
    (board.roster||[]).forEach(function(n){ var o=document.createElement("option"); o.value=n; o.textContent=n; sel.appendChild(o); });
    if(cur && (board.roster||[]).indexOf(cur)<0){ filter.assignee=""; cur=""; }
    sel.value=cur;
  }
  var qTimer=null;
  function initFilterUI(){
    var q=$("q"); if(q){ q.value=filter.q; q.addEventListener("input",function(){ filter.q=q.value; saveFilter(); clearTimeout(qTimer); qTimer=setTimeout(render,120); }); }
    var vs=$("viewSeg"); if(vs){ mark("#viewSeg","data-view",filter.view); Array.prototype.forEach.call(vs.querySelectorAll("button"),function(b){ b.addEventListener("click",function(){ filter.view=b.getAttribute("data-view"); saveFilter(); mark("#viewSeg","data-view",filter.view); render(); }); }); }
    var fa=$("fAssignee"); if(fa){ fa.addEventListener("change",function(){ filter.assignee=fa.value; saveFilter(); render(); }); }
    var hd=$("hideDone"); if(hd){ hd.checked=!!filter.hideDone; hd.addEventListener("change",function(){ filter.hideDone=hd.checked; saveFilter(); render(); }); }
  }

  function applyTheme(){
    var s=document.documentElement.style;
    s.setProperty("--hd-bg",theme.hdBg); s.setProperty("--hd-text",theme.hdText); s.setProperty("--bd-bg",theme.bdBg); s.setProperty("--bd-text",theme.bdText);
    var m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute("content",theme.hdBg);
    saveRaw("list_theme",theme);
    if($("cHdBg")){ $("cHdBg").value=theme.hdBg; $("cHdText").value=theme.hdText; $("cBdBg").value=theme.bdBg; $("cBdText").value=theme.bdText; }
  }
  function applyPrefs(){
    document.documentElement.setAttribute("data-font",fontPref); localStorage.setItem("list_font",fontPref);
    document.documentElement.setAttribute("data-size",sizePref); localStorage.setItem("list_size",sizePref);
    if(boldPref) document.documentElement.setAttribute("data-bold","1"); else document.documentElement.removeAttribute("data-bold");
    localStorage.setItem("list_bold",boldPref?"1":"0");
    mark("#fontSeg","data-font",fontPref); mark("#sizeSeg","data-size",sizePref); mark("#boldSeg","data-bold",boldPref?"1":"0");
  }
  function mark(sel,attr,val){ Array.prototype.forEach.call(document.querySelectorAll(sel+" button"),function(b){ b.classList.toggle("on",b.getAttribute(attr)===val); }); }

  function statusSelect(val){
    var sel=document.createElement("select"); sel.className="cell cell-status";
    STATUS_OPTS.forEach(function(o){ var op=document.createElement("option"); op.value=o; op.textContent=o||"\u2014"; sel.appendChild(op); });
    sel.value=val||""; sel.setAttribute("data-v",sel.value); return sel;
  }
  function cellInput(row,col){
    if(col.type==="status"){
      var sel=statusSelect(row.vals[col.key]); sel.setAttribute("data-k",col.key);
      sel.addEventListener("change",function(){ row.vals[col.key]=sel.value; sel.setAttribute("data-v",sel.value); commit(); if(filtering()) render(); });
      return sel;
    }
    var inp=document.createElement("input"); inp.className="cell"; inp.setAttribute("data-k",col.key);
    inp.type = col.type==="date" ? "date" : "text";
    if(col.type==="priority"){ inp.setAttribute("inputmode","numeric"); }
    if(col.key==="desc"){ inp.setAttribute("list","common"); }
    if(col.type==="person"){ inp.setAttribute("list","roster"); }
    var raw=row.vals[col.key]||"";
    inp.value = col.type==="priority" ? pad4(raw) : raw;
    inp.addEventListener("focus",function(){ if(col.type==="priority") inp.value=raw===""?"":String(raw); });
    inp.addEventListener("blur",function(){
      var v=inp.value;
      if(col.type==="priority"){ v=v.replace(/[^0-9]/g,""); row.vals[col.key]=v; inp.value=pad4(v); }
      else { row.vals[col.key]=v; }
      raw=row.vals[col.key]; commit();
    });
    inp.addEventListener("change",function(){ if(col.type==="date"){ row.vals[col.key]=inp.value; raw=inp.value; commit(); } });
    return inp;
  }

  function render(){
    var cs=cols();
    // colgroup: check + data cols + delete
    cg.innerHTML="";
    var cchk=document.createElement("col"); cchk.style.width="var(--tap)"; cg.appendChild(cchk);
    cs.forEach(function(c){ var col=document.createElement("col"); col.style.width=c.width+"px"; cg.appendChild(col); });
    var cdel=document.createElement("col"); cdel.style.width="var(--tap)"; cg.appendChild(cdel);

    // head
    thd.innerHTML="";
    var htr=document.createElement("tr");
    var hchk=document.createElement("th"); hchk.className="mini"; htr.appendChild(hchk);
    cs.forEach(function(c){
      var th=document.createElement("th"); th.setAttribute("data-key",c.key);
      var inw=document.createElement("div"); inw.className="th-in";
      var lbl=document.createElement("span"); lbl.className="th-lbl"; lbl.textContent=c.label;
      var sortEl=document.createElement("span"); sortEl.className="th-sort"; sortEl.textContent = sort.key===c.key ? (sort.dir>0?"\u25B2":"\u25BC") : "";
      var grip=document.createElement("div"); grip.className="th-grip"; grip.title="Drag to resize";
      inw.appendChild(lbl); inw.appendChild(sortEl); inw.appendChild(grip);
      th.appendChild(inw);
      lbl.addEventListener("click",function(){ if(sort.key===c.key){ sort.dir=sort.dir>0?-1:1; } else { sort.key=c.key; sort.dir=1; } saveRaw("list_sort",sort); render(); });
      attachResize(grip,c);
      attachReorder(th,inw,grip,c);
      htr.appendChild(th);
    });
    var hdel=document.createElement("th"); hdel.className="mini"; htr.appendChild(hdel);
    thd.appendChild(htr);

    // body (built off-DOM in one pass for speed on long lists)
    var frag=document.createDocumentFragment();
    visibleRows().forEach(function(row){ frag.appendChild(buildRowTr(row)); });
    frag.appendChild(buildAddRow());
    tb.innerHTML=""; tb.appendChild(frag);
    updateCount();
  }

  function buildRowTr(row){
    var cs=cols();
    var tr=document.createElement("tr"); tr.setAttribute("data-id",row.id); if(row.done) tr.className="done";
    var tdc=document.createElement("td"); tdc.className="mini";
    var chk=document.createElement("button"); chk.className="chk"; chk.setAttribute("aria-label","Tick"); chk.textContent=row.done?"\u2713":"";
    chk.onclick=function(){ row.done=!row.done; tr.classList.toggle("done",row.done); chk.textContent=row.done?"\u2713":""; commit(); if(filtering()&&!matchRow(row)){ if(tr.parentNode) tr.parentNode.removeChild(tr); } updateCount(); };
    tdc.appendChild(chk); tr.appendChild(tdc);
    cs.forEach(function(c){ var td=document.createElement("td"); if(c.type==="priority") td.className="pri"; td.appendChild(cellInput(row,c)); tr.appendChild(td); });
    var tdd=document.createElement("td"); tdd.className="mini";
    var del=document.createElement("button"); del.className="rowbtn"; del.setAttribute("aria-label","Delete forever"); del.textContent="\u00d7";
    del.onclick=function(){ board.rows=board.rows.filter(function(x){return x.id!==row.id;}); if(tr.parentNode) tr.parentNode.removeChild(tr); updateCount(); commit(); };
    tdd.appendChild(del); tr.appendChild(tdd);
    return tr;
  }
  function buildAddRow(){
    var cs=cols();
    var atr=document.createElement("tr"); atr.className="addrow";
    var ac=document.createElement("td"); ac.className="mini"; var plus=document.createElement("span"); plus.textContent="+"; plus.style.color="var(--muted)"; ac.appendChild(plus); atr.appendChild(ac);
    cs.forEach(function(c,idx){
      var td=document.createElement("td"); if(c.type==="priority") td.className="pri";
      var inp;
      if(c.type==="status"){ inp=statusSelect(""); }
      else { inp=document.createElement("input"); inp.className="cell"; inp.type=c.type==="date"?"date":"text"; if(idx===0) inp.placeholder="Add an item\u2026"; if(c.key==="desc") inp.setAttribute("list","common"); if(c.type==="person") inp.setAttribute("list","roster"); }
      inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); addFromBlank(true); } });
      inp.addEventListener("blur",function(){ setTimeout(function(){ var ae=document.activeElement; if(ae&&ae.closest&&ae.closest("tr.addrow")) return; addFromBlank(false); },140); });
      inp._k=c.key; td.appendChild(inp); atr.appendChild(td);
    });
    var ad=document.createElement("td"); ad.className="mini"; atr.appendChild(ad);
    return atr;
  }

  function addFromBlank(focusFirst){
    var inputs=tb.querySelectorAll("tr.addrow .cell"); var any=false, vals={};
    Array.prototype.forEach.call(inputs,function(inp){ if((inp.value||"").trim()) any=true; });
    if(!any) return;
    board.columns.forEach(function(c){ vals[c.key]=""; });
    Array.prototype.forEach.call(inputs,function(inp){ var v=(inp.value||"").trim(); if(inp._k==="priority") v=v.replace(/[^0-9]/g,""); vals[inp._k]=v; });
    var row={id:uid(),done:false,vals:vals}; board.rows.push(row); commit();
    if(sort.key||filtering()){ render(); }
    else { var addTr=tb.querySelector("tr.addrow"); tb.insertBefore(buildRowTr(row),addTr); Array.prototype.forEach.call(inputs,function(inp){ inp.value=""; }); updateCount(); }
    if(focusFirst){ var first=tb.querySelector("tr.addrow .cell"); if(first) first.focus(); }
  }
  function addItem(text){ var vals={}; board.columns.forEach(function(c){ vals[c.key]=""; }); vals.desc=text; var row={id:uid(),done:false,vals:vals}; board.rows.push(row); commit(); if(sort.key||filtering()){ render(); } else { var addTr=tb.querySelector("tr.addrow"); tb.insertBefore(buildRowTr(row),addTr); updateCount(); } }

  // column resize (pointer = works with S-Pen, touch, mouse)
  function attachResize(grip,c){
    grip.addEventListener("pointerdown",function(e){
      e.preventDefault(); e.stopPropagation(); var x0=e.clientX, w0=c.width; grip.setPointerCapture(e.pointerId);
      function mv(ev){ c.width=Math.max(64,w0+(ev.clientX-x0)); var i=cols().indexOf(c); var col=cg.children[i+1]; if(col) col.style.width=c.width+"px"; }
      function up(){ grip.releasePointerCapture(e.pointerId); grip.removeEventListener("pointermove",mv); grip.removeEventListener("pointerup",up); commit(); }
      grip.addEventListener("pointermove",mv); grip.addEventListener("pointerup",up);
    });
  }
  // column reorder by dragging the header
  function attachReorder(th,inw,grip,c){
    inw.addEventListener("pointerdown",function(e){
      if(e.target===grip) return; var x0=e.clientX, moved=false;
      function mv(ev){ if(!moved&&Math.abs(ev.clientX-x0)>8){ moved=true; th.classList.add("dragging"); } if(moved){ hi(ev.clientX); } }
      function up(ev){ document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up); th.classList.remove("dragging"); clearHi();
        if(moved){ var target=colAt(ev.clientX); if(target&&target!==c){ reorder(c,target); commit(); render(); } } }
      document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up);
    });
  }
  function colAt(x){ var ths=thd.querySelectorAll('th[data-key]'); var best=null; for(var i=0;i<ths.length;i++){ var r=ths[i].getBoundingClientRect(); if(x>=r.left&&x<=r.right){ var key=ths[i].getAttribute("data-key"); best=find(key); } } return best; }
  function hi(x){ clearHi(); var ths=thd.querySelectorAll('th[data-key]'); for(var i=0;i<ths.length;i++){ var r=ths[i].getBoundingClientRect(); if(x>=r.left&&x<=r.right) ths[i].classList.add("droppast"); } }
  function clearHi(){ Array.prototype.forEach.call(thd.querySelectorAll("th"),function(t){t.classList.remove("droppast");}); }
  function find(key){ for(var i=0;i<board.columns.length;i++) if(board.columns[i].key===key) return board.columns[i]; return null; }
  function reorder(from,to){ var a=board.columns.indexOf(from), b=board.columns.indexOf(to); board.columns.splice(a,1); board.columns.splice(b,0,from); }

  // settings: columns manager
  function buildColMgr(){
    var m=$("colmgr"); m.innerHTML="";
    board.columns.forEach(function(c,idx){
      var row=document.createElement("div"); row.className="colrow";
      var name=document.createElement("input"); name.className="t"; name.value=c.label; name.disabled=false;
      name.addEventListener("change",function(){ c.label=name.value||c.label; commit(); render(); });
      var tag=document.createElement("span"); tag.className="tag"; tag.textContent=c.type;
      var up=document.createElement("button"); up.className="mv"; up.textContent="\u25B2"; up.title="Move left"; up.onclick=function(){ if(idx>0){ var t=board.columns[idx-1]; board.columns[idx-1]=c; board.columns[idx]=t; commit(); render(); buildColMgr(); } };
      var dn=document.createElement("button"); dn.className="mv"; dn.textContent="\u25BC"; dn.title="Move right"; dn.onclick=function(){ if(idx<board.columns.length-1){ var t=board.columns[idx+1]; board.columns[idx+1]=c; board.columns[idx]=t; commit(); render(); buildColMgr(); } };
      var hide=document.createElement("button"); hide.className="mv"; hide.textContent=c.hidden?"\u2298":"\u25C9"; hide.title=c.hidden?"Show":"Hide"; hide.onclick=function(){ c.hidden=!c.hidden; commit(); render(); buildColMgr(); };
      var del=document.createElement("button"); del.className="mv"; del.textContent="\u00d7"; del.title="Delete column"; del.disabled=!!c.builtin; if(c.builtin) del.style.opacity=".3"; del.onclick=function(){ if(c.builtin) return; if(confirm("Delete column \""+c.label+"\"?")){ board.columns=board.columns.filter(function(x){return x!==c;}); commit(); render(); buildColMgr(); } };
      row.appendChild(name); row.appendChild(tag); row.appendChild(up); row.appendChild(dn); row.appendChild(hide); row.appendChild(del);
      m.appendChild(row);
    });
  }
  $("addColS").onclick=function(){ var name=prompt("New column name:"); if(!name) return; board.columns.push({key:"c"+uid(),label:name,type:"text",width:150,hidden:false,builtin:false}); commit(); render(); buildColMgr(); };

  // theme UI
  function buildPresets(){
    var p=$("presets"); p.innerHTML="";
    PRESETS.forEach(function(t){ p.appendChild(presetBtn(t,false)); });
  }
  function buildSaved(){
    var s=$("savedThemes"); s.innerHTML="";
    savedThemes.forEach(function(t,i){ var b=presetBtn(t,true); var x=document.createElement("button"); x.className="del"; x.textContent="\u00d7"; x.onclick=function(ev){ ev.stopPropagation(); savedThemes.splice(i,1); saveRaw("list_saved_themes",savedThemes); buildSaved(); }; b.appendChild(x); s.appendChild(b); });
  }
  function presetBtn(t,saved){
    var b=document.createElement("button"); b.className="preset"; b.title=t.name;
    var pv=document.createElement("div"); pv.className="pv"; var a=document.createElement("i"); a.style.background=t.hdBg; var c=document.createElement("i"); c.style.background=t.bdBg; pv.appendChild(a); pv.appendChild(c);
    var nm=document.createElement("small"); nm.textContent=t.name; b.appendChild(pv); b.appendChild(nm);
    b.addEventListener("click",function(){ theme={hdBg:t.hdBg,hdText:t.hdText,bdBg:t.bdBg,bdText:t.bdText}; applyTheme(); });
    return b;
  }

  // wire settings
  $("setBtn").onclick=function(){ $("settings").classList.add("open"); };
  $("closeSet").onclick=function(){ $("settings").classList.remove("open"); };
  $("settings").addEventListener("click",function(e){ if(e.target===this) this.classList.remove("open"); });
  [["cHdBg","hdBg"],["cHdText","hdText"],["cBdBg","bdBg"],["cBdText","bdText"]].forEach(function(p){ $(p[0]).addEventListener("input",function(){ theme[p[1]]=this.value; applyTheme(); }); });
  $("saveTheme").onclick=function(){ var nm=($("themeName").value||"").trim()||("Theme "+(savedThemes.length+1)); savedThemes.push({name:nm,hdBg:theme.hdBg,hdText:theme.hdText,bdBg:theme.bdBg,bdText:theme.bdText}); saveRaw("list_saved_themes",savedThemes); $("themeName").value=""; buildSaved(); };
  Array.prototype.forEach.call(document.querySelectorAll("#fontSeg button"),function(b){ b.onclick=function(){ fontPref=b.getAttribute("data-font"); applyPrefs(); }; });
  Array.prototype.forEach.call(document.querySelectorAll("#boldSeg button"),function(b){ b.onclick=function(){ boldPref=b.getAttribute("data-bold")==="1"; applyPrefs(); }; });
  Array.prototype.forEach.call(document.querySelectorAll("#sizeSeg button"),function(b){ b.onclick=function(){ sizePref=b.getAttribute("data-size"); applyPrefs(); }; });

  // quick add + common + voice
  function buildCommon(){ var dl=$("common"); dl.innerHTML=""; COMMON.forEach(function(n){ var o=document.createElement("option"); o.value=n; dl.appendChild(o); }); }
  function buildRoster(){ var dl=$("roster"); if(!dl) return; dl.innerHTML=""; (board.roster||[]).forEach(function(n){ var o=document.createElement("option"); o.value=n; dl.appendChild(o); }); }
  function buildRosterUI(){ var el=$("rosterList"); if(!el) return; el.innerHTML=""; (board.roster||[]).forEach(function(n,i){ var chip=document.createElement("span"); chip.className="rchip"; chip.appendChild(document.createTextNode(n)); var x=document.createElement("button"); x.textContent="\u00d7"; x.setAttribute("aria-label","Remove"); x.onclick=function(){ board.roster.splice(i,1); commit(); buildRoster(); buildRosterUI(); buildAssignee(); }; chip.appendChild(x); el.appendChild(chip); }); }
  (function(){ var raEl=$("rosterAdd"); if(raEl){ raEl.onclick=function(){ var n=($("rosterName").value||"").trim(); if(!n) return; if(!board.roster) board.roster=[]; board.roster.push(n); commit(); $("rosterName").value=""; buildRoster(); buildRosterUI(); buildAssignee(); }; var ri=$("rosterName"); if(ri) ri.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); raEl.click(); } }); } })();
  $("clrDone").onclick=function(){ board.rows=board.rows.filter(function(r){return !r.done;}); commit(); render(); };
  $("clrAll").onclick=function(){ if(board.rows.length&&confirm("Delete all rows?")){ board.rows=[]; commit(); render(); } };

  var micBtn=$("micBtn"), SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ micBtn.style.display="none"; }
  else{ var rec=new SR(); rec.lang="en-US"; rec.interimResults=false; var listening=false;
    micBtn.onclick=function(){ try{ listening?rec.stop():rec.start(); }catch(e){} };
    rec.onstart=function(){ listening=true; micBtn.classList.add("rec"); };
    rec.onend=function(){ listening=false; micBtn.classList.remove("rec"); };
    rec.onerror=function(){ listening=false; micBtn.classList.remove("rec"); };
    rec.onresult=function(ev){ (ev.results[0][0].transcript||"").split(/,| and | then /i).forEach(function(p){ var t=p.trim(); if(t) addItem(t); }); };
  }

  // install
  var deferred=null; window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); deferred=e; $("installBtn").style.display="block"; });
  $("installBtn").onclick=function(){ if(deferred){ deferred.prompt(); deferred=null; $("installBtn").style.display="none"; } };
  $("installHint").innerHTML="Installs on <b>Windows 11</b> (install icon in the address bar) and the <b>phone</b> (menu &rarr; Add to Home screen). Works with your <b>S Pen</b> or without. Everything syncs to your other device automatically.";
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }

  // sync
  function showToast(m){ var t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(function(){ t.classList.remove("show"); },4000); }
  if(window.ListSync&&ListSync.init){
    ListSync.init({
      onStatus:function(s){ if(s==="synced"||s==="sync on"){ syncdot.className="syncdot on"; syncdot.textContent="\u25CF Synced"; } else if(s==="offline"){ syncdot.className="syncdot off"; syncdot.textContent="\u25CF Can\u2019t reach sync"; } else { syncdot.textContent=""; } },
      onRemote:function(rem){ if(!(rem&&rem.data&&typeof rem.stamp==="number"&&rem.stamp>stamp)) return; var ae=document.activeElement; if(ae&&ae.classList&&ae.classList.contains("cell")){ pendingRemote=rem; return; } applyRemote(rem); }
    });
    if(ListSync.justConfigured&&ListSync.justConfigured()) showToast("\u2713 Sync turned on \u2014 this device is now linked.");
  }

  // flush sync + apply any deferred remote update when leaving a cell / hiding the app
  document.addEventListener("focusout",function(e){ if(e.target&&e.target.classList&&e.target.classList.contains("cell")){ setTimeout(function(){ var ae=document.activeElement; if(ae&&ae.classList&&ae.classList.contains("cell")) return; if(pendingRemote){ var r=pendingRemote; pendingRemote=null; if(r.stamp>stamp) applyRemote(r); } },160); } });
  window.addEventListener("pagehide",flushSync); document.addEventListener("visibilitychange",function(){ if(document.hidden) flushSync(); });

  // boot
  applyTheme(); applyPrefs(); buildCommon(); buildRoster(); buildRosterUI(); buildAssignee(); initFilterUI(); buildPresets(); buildSaved(); buildColMgr(); render();
})();
</script>
